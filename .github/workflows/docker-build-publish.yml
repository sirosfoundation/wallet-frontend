name: "Create and publish container images"

on:
  push:
    branches:
      - release/sirosid
      - release/sirosid/**
    tags:
      - 'v*.*.**'
      - 'v*.*.**-sirosid.*'
  pull_request:
    branches:
      - release/sirosid
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to build (branch, tag, or SHA)'
        required: false
        default: 'release/sirosid'
      image_tag:
        description: 'Custom image tag (leave empty for standard policy)'
        required: false
        default: ''

env:
  REGISTRY: "ghcr.io"
  NAME: "${{ github.repository }}"

jobs:
  "build-and-push-image":
    runs-on: "ubuntu-24.04"
    permissions:
      contents: "read"
      packages: "write"

    steps:
      # GHCR doesn't accept uppercase characters in repository path \_o_/
      - name: "Extract lowercase image name"
        id: "lowercaser"
        run: "echo \"name=${NAME}\" | tr '[[:upper:]]' '[[:lower:]]' >> \"${GITHUB_OUTPUT}\""

      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref }}

      - name: "Setup Buildx for Docker"
        uses: "docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069"

      - name: "Log in to the Container registry"
        if: github.event_name != 'pull_request'
        uses: "docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a"
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Extract metadata for Docker"
        id: "meta"
        uses: "docker/metadata-action@v6"
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercaser.outputs.name }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=unstable,enable=${{ github.ref == 'refs/heads/release/sirosid' }}
            type=sha,prefix=unstable-,enable=${{ github.ref == 'refs/heads/release/sirosid' }}
            type=ref,event=pr
            type=raw,value=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}

      - name: "Build and push Docker image"
        uses: "docker/build-push-action@v7"
        with:
          file: "Dockerfile"
          context: "."
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
