name: SBOM

on:
  push:
    branches: [release/sirosid]
  pull_request:
    branches: [release/sirosid]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sbom:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/v')
    uses: sirosfoundation/.github/.github/workflows/sbom.yml@03160e376dbdeb9f2c904e7a9f45499b2f67e8fa # main
    with:
      artifact-name: wallet-frontend
      scan-vulnerabilities: true
      sign-sbom: false
    permissions:
      contents: write
      id-token: write
      security-events: write
